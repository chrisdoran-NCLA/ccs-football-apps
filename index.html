<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CCS Football Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCS Football">
<meta name="theme-color" content="#101b30">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --navy:#101b30;
    --navy-2:#1b2b4a;
    --gold:#b9924f;
    --gold-light:#e4c78a;
    --red:#9c2b23;
    --paper:#f3f1ea;
    --paper-2:#e8e4d8;
    --ink:#1a1a1a;
    --line:#cfc9b8;
    --good:#2f6b3f;
    --bad:#9c2b23;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--sans); height:100%; overscroll-behavior-y:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  #iframeWarning{display:none; background:var(--red); color:#fff; font-weight:700; padding:10px 14px; font-size:13px; text-align:center; line-height:1.4;}
  #iframeWarning a{color:#fff; text-decoration:underline;}

  header{background:var(--navy); color:var(--paper); padding:14px 16px 10px; position:sticky; top:0; z-index:20; border-bottom:3px solid var(--gold);}
  .brand{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand-title{font-weight:800; letter-spacing:.06em; text-transform:uppercase; font-size:15px; color:var(--gold-light);}
  .brand-sub{font-size:11px; opacity:.65; letter-spacing:.08em; text-transform:uppercase; margin-top:1px;}
  .game-pill{background:var(--navy-2); border:1px solid rgba(228,199,138,.35); color:var(--paper); font-size:11px; padding:5px 10px; border-radius:999px; white-space:nowrap; max-width:46vw; overflow:hidden; text-overflow:ellipsis;}

  nav{display:flex; background:var(--navy); border-bottom:1px solid rgba(0,0,0,.25);}
  nav button{flex:1; background:none; border:none; color:rgba(243,241,234,.55); font-family:var(--sans); font-weight:700; font-size:12px; letter-spacing:.03em; text-transform:uppercase; padding:10px 4px 12px; border-bottom:3px solid transparent;}
  nav button.active{color:var(--gold-light); border-bottom-color:var(--gold);}

  main{padding:14px 14px 90px; max-width:720px; margin:0 auto;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card h2{margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#6b6250; font-weight:800;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}

  button{cursor:pointer; font-family:var(--sans);}
  .btn{border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:10px 12px; font-size:14px; font-weight:600; min-height:44px;}
  .btn.small{padding:7px 10px; font-size:12px; min-height:36px;}
  .btn.selected{background:var(--navy); color:var(--gold-light); border-color:var(--navy);}
  .btn.gold{background:var(--gold); border-color:var(--gold); color:var(--navy); font-weight:800;}
  .btn.gold:disabled{opacity:.35;}
  .btn.ghost{background:transparent; border-color:transparent; color:#6b6250; text-decoration:underline; min-height:auto; padding:6px 4px;}
  .btn.danger{background:#fff; border-color:var(--red); color:var(--red);}
  .btn.wide{width:100%;}

  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:44px; height:44px; border-radius:10px; font-size:20px; font-weight:800;}
  .stepper .num{font-family:var(--mono); font-size:20px; font-weight:800; min-width:54px; text-align:center;}

  .chipgrid{display:flex; flex-wrap:wrap; gap:8px;}
  .chipgrid button{flex:0 0 auto;}

  .call-preview{background:var(--navy); color:var(--gold-light); font-family:var(--mono); font-weight:700; font-size:15px; padding:12px 14px; border-radius:12px; margin-bottom:12px; min-height:20px; word-break:break-word;}
  .call-preview .default-note{color:rgba(228,199,138,.55); font-family:var(--sans); font-weight:400; font-size:11px; display:block; margin-top:3px;}

  input[type="text"], input[type="number"]{border:1.5px solid var(--line); border-radius:10px; padding:10px; font-size:14px; font-family:var(--sans); width:100%;}

  .result-tags{display:flex; flex-wrap:wrap; gap:8px;}
  .result-tags button{border-radius:999px;}

  .recent-list{display:flex; flex-direction:column; gap:8px;}
  .play-row{border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .play-row .meta{font-family:var(--mono); color:#6b6250; font-size:11px;}
  .play-row .call{font-weight:700; color:var(--navy);}
  .play-row .yards{font-family:var(--mono); font-weight:800; padding:3px 8px; border-radius:8px;}
  .yards.good{background:#e4f0e6; color:var(--good);}
  .yards.bad{background:#f5e2e0; color:var(--bad);}
  .side-badge{font-family:var(--mono); font-size:9px; font-weight:800; padding:2px 6px; border-radius:6px; margin-right:6px; letter-spacing:.03em; display:inline-block;}
  .side-badge.offense{background:#e4f0e6; color:var(--good);}
  .side-badge.defense{background:#e2e8f5; color:var(--navy);}

  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
  .bar-row .bar-label .name{font-weight:700; color:var(--navy);}
  .bar-row .bar-label .stat{font-family:var(--mono); color:#6b6250;}
  .bar-track{background:var(--paper-2); border-radius:6px; height:10px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--gold); border-radius:6px;}
  .bar-fill.low{background:var(--red);}
  .n-warn{font-size:10px; color:#b08a3e; margin-left:4px;}

  select{border:1.5px solid var(--line); border-radius:10px; padding:9px; font-size:13px; width:100%; background:#fff;}
  label.field-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#6b6250; font-weight:700; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .empty-state{text-align:center; padding:30px 10px; color:#8a8271;}
  .empty-state .big{font-size:15px; font-weight:700; color:var(--navy); margin-bottom:6px;}
  .save-bar{position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); z-index:15;}
  .flash{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--navy); color:var(--gold-light); padding:10px 18px; border-radius:999px; font-weight:700; font-size:13px; z-index:50; opacity:0; transition:opacity .2s;}
  .flash.show{opacity:1;}
  .backup-note{background:#fbf3e3; border:1px solid #e4c78a; border-radius:10px; padding:10px 12px; font-size:12.5px; color:#5a4a24; line-height:1.45;}
  .danger-zone{border:1px dashed var(--red); border-radius:10px; padding:10px 12px;}
  .slot-box{min-width:112px;}
  hr.sep{border:none; border-top:1px solid var(--line); margin:12px 0;}
</style>
</head>
<body>

<div id="iframeWarning">
  This is a live preview inside chat — your data won't be saved here.
  Download this file and open it directly in Safari on your iPad (then "Add to Home Screen") so play data actually persists between games.
</div>

<header>
  <div class="brand">
    <div>
      <div class="brand-title">CCS Football Tracker</div>
      <div class="brand-sub">Pursue. Swarm. Hit. &middot; Attack. Attack. Attack.</div>
    </div>
    <div class="game-pill" id="activeGamePill">No game selected</div>
  </div>
</header>

<nav>
  <button data-tab="log" class="active">Log Play</button>
  <button data-tab="list">Play Log</button>
  <button data-tab="trends">Trends</button>
  <button data-tab="games">Games</button>
  <button data-tab="data">Data</button>
</nav>

<main id="main"></main>

<div class="flash" id="flash"></div>

<script>
/* ===================== DEFENSE TAXONOMY ===================== */

const PERSONNEL = [
  {id:'base8',  mode:'8',  label:'D-Base 41 Joker', formation:'4-2-2', roster:'E-H-LT-RT-M-J-LC-RC', family:'base',  isDefault:true},
  {id:'rhino8', mode:'8',  label:'Rhino',            formation:'5-1-2', roster:'E-H-LT-RT-NT-M-LC-RC', family:'rhino'},
  {id:'knight8',mode:'8',  label:'Knight',           formation:'4-3-1', roster:'E-H-LT-RT-M-J(L)-R-S', family:'other'},
  {id:'nickel8',mode:'8',  label:'Nickel',           formation:'3-2-3', roster:'E-H-NT-M-J-LC-RC-S', family:'nickel'},
  {id:'skinny8',mode:'8',  label:'Skinny',           formation:'2-2-4', roster:'E-H-M-J-LC-RC-SS-S', family:'other'},

  {id:'base11',  mode:'11', label:'Base 43 Joker',  formation:'4-4-3', roster:'E-H-LT-RT-M-L-R-J-LC-RC-S', family:'base', isDefault:true},
  {id:'rhino11', mode:'11', label:'Rhino 52 Joker', formation:'5-3-3', roster:'E-H-LT-RT-NT-M-L-J-LC-RC-S', family:'rhino'},
  {id:'nickel11',mode:'11', label:'Nickel',          formation:'3-3-5', roster:'E-H-NT-M-L-R-J-LC-RC-N-S', family:'nickel'},
  {id:'skinny11',mode:'11', label:'Skinny',          formation:'3-2-6', roster:'E-H-NT-M-L-J-LC-RC-N-D-S', family:'other'},
];

const FRONTS = {
  base:  ['Even','Over','Under','Alpha','Beta','Even Pinch','Even Slant','Even Out','Even Tango','Even Hammer','Even Double Pinch'],
  rhino: ['Rhino Even','Rhino Odd (Beta)','Rhino Wide','Rhino Under','Rhino Over','Rhino Even Pinch','Rhino Even Slant Right','Rhino Even Out','Rhino Even Stunt','Rhino Wide Pinch','Rhino Wide Slant','Rhino Odd Slant'],
  nickel:['Hammer','Over','Slant','Sting','Tango'],
  other: ['Even','Over','Under','Storm'],
};

const BLITZ = {
  '8':  ['None','Ace','Aces','Strike','Laser','Rocket'],
  '11': ['None','Owl','Owls','House','Joker','Strike','Laser','Rocket'],
};

const COVERAGE_GROUPS = [
  {label:'Man', items:['Cover 0 (Michigan)','Cover 0 (Miami)','Cover 1 (Halo Michigan)','Michigan Halo Robber','Michigan Double Halo']},
  {label:'Zone', items:['Cover 2 (Alabama)','Cover 2 (Arkansas)','Trips Zone (Trips Alabama)','Cover 3 (Cloud)','Cover 3/4 (Storm Cloud)','Cover 3 Robber (Ace)','Cover 3 Robber (Tango)','Cover 4 (Storm Cloud Ace)'],
  },
];

const DEF_RESULT_TAGS = ['Sack','TFL','INT','Fumble Recovery','Forced Fumble','Pass Breakup','Penalty (Us)','Penalty (Them)','TD Allowed','QB Scramble'];

/* ===================== OFFENSE TAXONOMY ===================== */

const OFF_FORMATIONS = [
  // 8-man
  {label:'Pistol Rt.', mode:'8'}, {label:'Pistol Lt.', mode:'8'},
  {label:'Wing Rt.', mode:'8'}, {label:'Wing Lt.', mode:'8'},
  {label:'Boomer Rt.', mode:'8'}, {label:'Boomer Lt.', mode:'8'},
  {label:'Trips Rt.', mode:'8'}, {label:'Trips Lt.', mode:'8'},
  {label:'Trips Rt. Bunch', mode:'8'}, {label:'Trips Lt. Bunch', mode:'8'},
  {label:'Power I Rt.', mode:'8'}, {label:'Power I Lt.', mode:'8'},
  {label:'Quads', mode:'8'}, {label:'Quads Switch', mode:'8'},
  {label:'Pro Set', mode:'8'}, {label:'Ace I / Split', mode:'8'},
  {label:'Slot Left', mode:'8'}, {label:'Slot Right', mode:'8'},
  // 11-man
  {label:'Pistol Rt.', mode:'11'}, {label:'Pistol Lt.', mode:'11'},
  {label:'Quads Rt.', mode:'11'}, {label:'Quads Lt.', mode:'11'},
  {label:'Quads Z Back', mode:'11'}, {label:'Pro Rt. I (XY Wide)', mode:'11'},
  {label:'Trips Rt.', mode:'11'}, {label:'Trips Lt.', mode:'11'},
  {label:'Trips Rt. Bunch', mode:'11'}, {label:'Trips Lt. Bunch', mode:'11'},
  {label:'Twins Rt.', mode:'11'}, {label:'Twins Lt.', mode:'11'},
];

const PERSONNEL_PACKAGES = ['Standard', "Wendy's", 'Cheetah'];
const OFF_MOTIONS = ['None','X Motion','Y Motion','2 Motion','3 Motion','Crack','Weak','Strong','Orbit'];
const RUN_NUMBERS = ['11','17','18','21','22','23','24','27','28','31','32','33','34','37','38'];
const RUN_CONCEPTS = ['Direct','Counter','Trap','Jet','Draw','Bootleg','Option','Sweep'];
const ROUTE_TREE = [
  {n:'0', label:'Edelman'}, {n:'1', label:'Hitch'}, {n:'2', label:'Slant'},
  {n:'3', label:'Sp.Out'}, {n:'4', label:'Curl'}, {n:'5', label:'D.Out'},
  {n:'6', label:'Dig'}, {n:'7', label:'Corner'}, {n:'8', label:'Post'},
  {n:'9', label:'Go'}, {n:'B', label:'Block'},
];
const ROUTE_TAGS = ['R','Wheel','Slugo','Idaho','Arrow','Return','McQueen','Bubble','Delay','Oklahoma'];
const OFF_MODIFIERS = ['Tight','Wide','Change','Overload','Heavy','E'];
const OFF_RESULT_TAGS = ['Sack Taken','TFL Taken','INT Thrown','Fumble Lost','TD Scored','Penalty (Us)','Penalty (Them)','Explosive Play','QB Scramble','2pt Conversion'];

const DISTANCE_PRESETS = [1,2,3,5,7,10,15,20];

function slotsForMode(mode){ return mode==='11' ? ['X','Y','2','3','Z'] : ['X','Y','2','3']; }
function currentReceiverSlots(){ return slotsForMode(state.mode); }

/* ===================== STATE ===================== */

const STORAGE_KEY = 'ccsDefenseState_v1'; // kept stable so existing on-device data isn't lost

function defaultState(){
  return {
    mode:'8', // '8' or '11'
    games: [],
    activeGameId: null,
    plays: [],
    builder: emptyBuilder(),
  };
}
function emptyBuilder(){
  return {
    side:'defense', // 'defense' | 'offense'
    down:1, distance:10, quarter:1, clock:'',
    // defense fields
    personnelId:null, personnelCustom:'',
    front:null, frontCustom:'',
    blitz:'None', blitzCustom:'', shake:false,
    coverage:null, coverageCustom:'',
    // offense fields
    formation:null, formationCustom:'',
    personnelPackage:'Standard',
    motion:'None', motionCustom:'',
    playType:'run', runNumber:'', runConcepts:[],
    routes:{X:'',Y:'','2':'','3':'','Z':''},
    modifiers:[], modifiersCustom:'',
    fake:false, fakeText:'',
    // shared result
    yards:0, tags:[], notes:'',
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    const merged = Object.assign(base, parsed, {builder: Object.assign(emptyBuilder(), parsed.builder||{})});
    // migrate plays saved before offense/defense side existed
    merged.plays = (merged.plays||[]).map(p=> p.side ? p : Object.assign({}, p, {side:'defense'}));
    return merged;
  }catch(e){
    console.error('Failed to load state, starting fresh.', e);
    return defaultState();
  }
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Storage error', e);
    showFlash('⚠️ Could not save — storage may be full');
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ===================== SUCCESS MODELS ===================== */
// Standard down-and-distance success convention.
// Defense: success = stop offense below the threshold (or force a turnover); TD allowed = failure.
// Offense: success = meet/beat the threshold (or score); turnover thrown/lost = failure.
function computeDefenseSuccess(down, distance, yards, tags){
  if(tags.includes('INT') || tags.includes('Fumble Recovery')) return true;
  if(tags.includes('TD Allowed')) return false;
  const dist = Math.max(distance,1);
  let offenseSuccess;
  if(down===1) offenseSuccess = yards >= 0.5*dist;
  else if(down===2) offenseSuccess = yards >= 0.7*dist;
  else offenseSuccess = yards >= dist;
  return !offenseSuccess;
}
function computeOffenseSuccess(down, distance, yards, tags){
  if(tags.includes('INT Thrown') || tags.includes('Fumble Lost')) return false;
  if(tags.includes('TD Scored')) return true;
  const dist = Math.max(distance,1);
  if(down===1) return yards >= 0.5*dist;
  if(down===2) return yards >= 0.7*dist;
  return yards >= dist;
}
function computeSuccess(b){
  return b.side==='offense'
    ? computeOffenseSuccess(b.down, b.distance, b.yards, b.tags)
    : computeDefenseSuccess(b.down, b.distance, b.yards, b.tags);
}

/* ===================== CALL STRINGS ===================== */
function personnelById(id){ return PERSONNEL.find(p=>p.id===id); }
function frontFamilyFor(personnelId){
  const p = personnelById(personnelId);
  return p ? p.family : 'other';
}
function buildDefenseCallString(b){
  const p = personnelById(b.personnelId);
  const personnelLabel = b.personnelId==='__custom' ? b.personnelCustom : (p? p.label : '');
  const isDefaultPersonnel = p && p.isDefault;
  const frontLabel = b.front==='__custom' ? b.frontCustom : b.front;
  const blitzLabel = b.blitz==='__custom' ? b.blitzCustom : b.blitz;
  const blitzPart = (blitzLabel && blitzLabel!=='None') ? (blitzLabel + (b.shake? ' (Shake)':'')) : null;
  const covLabel = b.coverage==='__custom' ? b.coverageCustom : b.coverage;

  let str = frontLabel ? (personnelLabel && !isDefaultPersonnel ? personnelLabel+' ' : '') + frontLabel : '';
  const rest = [blitzPart, covLabel].filter(Boolean);
  if(rest.length) str += (str? ', ':'') + rest.join(', ');
  return str || '(building call…)';
}
function buildOffenseCallString(b){
  const parts = [];
  const formationLabel = b.formation==='__custom' ? b.formationCustom : b.formation;
  if(formationLabel) parts.push(formationLabel);
  if(b.personnelPackage && b.personnelPackage!=='Standard') parts.push(b.personnelPackage);
  const modLabels = (b.modifiers||[]).slice();
  if(b.modifiersCustom && b.modifiersCustom.trim()) modLabels.push(b.modifiersCustom.trim());
  if(modLabels.length) parts.push(modLabels.join(' '));
  const motionLabel = b.motion==='__custom' ? b.motionCustom : b.motion;
  if(motionLabel && motionLabel!=='None') parts.push(motionLabel);
  if(b.fake && b.fakeText && b.fakeText.trim()) parts.push('Fake '+b.fakeText.trim());
  let playCode = '';
  if(b.playType==='run'){
    playCode = (b.runNumber||'').trim();
    if(b.runConcepts && b.runConcepts.length) playCode += (playCode? ' ':'') + b.runConcepts.join(' ');
  } else {
    playCode = currentReceiverSlots().map(s=>b.routes[s]||'').join('');
  }
  if(playCode) parts.push(playCode);
  return parts.join(' ') || '(building call…)';
}
function buildCallString(b){
  return b.side==='offense' ? buildOffenseCallString(b) : buildDefenseCallString(b);
}

/* ===================== NAV / RENDER ===================== */
const mainEl = document.getElementById('main');
const navButtons = document.querySelectorAll('nav button');
let activeTab = 'log';

navButtons.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    navButtons.forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });
});

function showFlash(msg){
  const f = document.getElementById('flash');
  f.textContent = msg;
  f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'), 1400);
}

function activeGame(){
  return state.games.find(g=>g.id===state.activeGameId) || null;
}
function updateGamePill(){
  const pill = document.getElementById('activeGamePill');
  const g = activeGame();
  pill.textContent = g ? ('vs '+g.opponent+(g.date? ' · '+g.date:'')) : 'No game selected';
}

function render(){
  updateGamePill();
  if(activeTab==='log') renderLog();
  else if(activeTab==='list') renderList();
  else if(activeTab==='trends') renderTrends();
  else if(activeTab==='games') renderGames();
  else if(activeTab==='data') renderData();
}

/* ===================== LOG PLAY TAB ===================== */
function renderLog(){
  const b = state.builder;
  const g = activeGame();

  if(!g){
    mainEl.innerHTML = `
      <div class="card empty-state">
        <div class="big">Start a game first</div>
        <p>Create or select a game under the "Games" tab, then come back here to log plays.</p>
        <button class="btn gold" onclick="switchTab('games')">Go to Games</button>
      </div>`;
    return;
  }

  let html = sideToggleCardHtml(b) + situationCardHtml(b) + callPreviewCardHtml(b);
  html += b.side==='offense' ? offenseBuilderHtml(b) : defenseBuilderHtml(b);
  html += resultCardHtml(b);
  html += saveBarHtml(b);
  mainEl.innerHTML = html;
}

function sideToggleCardHtml(b){
  return `
    <div class="card">
      <h2>Side of Ball</h2>
      <div class="chipgrid">
        <button class="btn ${b.side==='defense'?'selected':''}" onclick="setSide('defense')">Defense</button>
        <button class="btn ${b.side==='offense'?'selected':''}" onclick="setSide('offense')">Offense</button>
      </div>
    </div>
  `;
}

function situationCardHtml(b){
  return `
    <div class="card">
      <h2>Situation</h2>
      <div class="row" style="margin-bottom:10px;">
        <div style="flex:1;">
          <label class="field-label">Down</label>
          <div class="chipgrid">
            ${[1,2,3,4].map(d=>`<button class="btn small ${b.down===d?'selected':''}" onclick="setDown(${d})">${ordinal(d)}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="row" style="margin-bottom:10px;">
        <div style="flex:1;">
          <label class="field-label">Distance</label>
          <div class="chipgrid">
            ${DISTANCE_PRESETS.map(dist=>`<button class="btn small ${b.distance===dist?'selected':''}" onclick="setDistance(${dist})">${dist}</button>`).join('')}
            <div class="stepper" style="margin-left:4px;">
              <button class="btn small" onclick="nudgeDistance(-1)">&minus;</button>
              <span class="num" style="font-size:14px; min-width:34px;">${b.distance}</span>
              <button class="btn small" onclick="nudgeDistance(1)">+</button>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div style="flex:1;">

function canSave(b){
  if(b.side==='offense'){
    const hasFormation = b.formation==='__custom' ? !!b.formationCustom.trim() : !!b.formation;
    if(!hasFormation) return false;
    if(b.playType==='run') return !!(b.runNumber && b.runNumber.trim());
    return currentReceiverSlots().some(s=>b.routes[s]);
  }
  const hasPersonnel = b.personnelId==='__custom' ? !!b.personnelCustom.trim() : !!b.personnelId;
  const hasFront = b.front==='__custom' ? !!b.frontCustom.trim() : !!b.front;
  return hasPersonnel && hasFront;
}

function repeatLastCall(){
  const last = state.plays.filter(p=>p.gameId===state.activeGameId).slice(-1)[0];
  if(!last){ showFlash('No previous play to repeat'); return; }
  const common = {down:state.builder.down, distance:state.builder.distance, quarter:state.builder.quarter, clock:state.builder.clock, side:last.side};
  if(last.side==='offense'){
    state.builder = Object.assign(emptyBuilder(), common, {
      formation:last.formation, formationCustom:last.formationCustom||'',
      personnelPackage:last.personnelPackage||'Standard',
      motion:last.motion, motionCustom:last.motionCustom||'',
      playType:last.playType||'run', runNumber:last.runNumber||'', runConcepts:(last.runConcepts||[]).slice(),
      routes:Object.assign({X:'',Y:'','2':'','3':'','Z':''}, last.routes||{}),
      modifiers:(last.modifiers||[]).slice(), modifiersCustom:last.modifiersCustom||'',
      fake:last.fake||false, fakeText:last.fakeText||'',
    });
  } else {
    state.builder = Object.assign(emptyBuilder(), common, {
      personnelId:last.personnelId, personnelCustom:last.personnelCustom||'',
      front:last.front, frontCustom:last.frontCustom||'',
      blitz:last.blitz, blitzCustom:last.blitzCustom||'', shake:last.shake,
      coverage:last.coverage, coverageCustom:last.coverageCustom||'',
    });
  }
  saveState(); render();
  showFlash('Loaded last call — set result after the snap');
}

function savePlay(){
  const b = state.builder;
  if(!canSave(b)) return;
  const callString = buildCallString(b);
  const success = computeSuccess(b);
  const play = {
    id: uid(), gameId: state.activeGameId, ts: Date.now(), side: b.side,
    quarter: b.quarter, clock: b.clock, down: b.down, distance: b.distance,
    personnelId: b.personnelId, personnelCustom: b.personnelCustom,
    front: b.front, frontCustom: b.frontCustom,
    blitz: b.blitz, blitzCustom: b.blitzCustom, shake: b.shake,
    coverage: b.coverage, coverageCustom: b.coverageCustom,
    formation: b.formation, formationCustom: b.formationCustom,
    personnelPackage: b.personnelPackage,
    motion: b.motion, motionCustom: b.motionCustom,
    playType: b.playType, runNumber: b.runNumber, runConcepts: (b.runConcepts||[]).slice(),
    routes: Object.assign({}, b.routes),
    modifiers: (b.modifiers||[]).slice(), modifiersCustom: b.modifiersCustom,
    fake: b.fake, fakeText: b.fakeText,
    callString, yards: b.yards, tags: b.tags.slice(), notes: b.notes, success,
    mode: state.mode,
  };
  state.plays.push(play);
  resetBuilder();
  saveState();
  showFlash('Play saved ✓');
  render();
}

function trendsSectionHtml(title, plays, side){
  if(plays.length===0){
    return `<div class="card"><h2>${title}</h2><div style="font-size:13px; color:#6b6250;">No ${title.toLowerCase()} plays logged yet in this scope.</div></div>`;
  }
  const overall = successRate(plays);
  let groups = '';
  if(side==='defense'){
    groups += groupCard('By Down', groupBy(plays, p=>ordinal(p.down)));
    groups += groupCard('By Personnel', groupBy(plays, p=>p.personnelId==='__custom'?p.personnelCustom:(personnelById(p.personnelId)?.label||'—')));
    groups += groupCard('By Front / Call', groupBy(plays, p=>p.front==='__custom'?p.frontCustom:p.front));
    groups += groupCard('By Blitz', groupBy(plays, p=>(p.blitz==='__custom'?p.blitzCustom:p.blitz)||'None'));
    groups += groupCard('By Coverage', groupBy(plays, p=>p.coverage==='__custom'?p.coverageCustom:p.coverage));
  } else {
    groups += groupCard('By Down', groupBy(plays, p=>ordinal(p.down)));
    groups += groupCard('By Formation', groupBy(plays, p=>p.formation==='__custom'?p.formationCustom:p.formation));
    groups += groupCard('By Play Type', groupBy(plays, p=>p.playType==='run'?'Run':'Pass'));
    groups += groupCard('By Motion', groupBy(plays, p=>(p.motion==='__custom'?p.motionCustom:p.motion)||'None'));
  }
  return `
    <div class="card">
      <h2>${title} Overall</h2>
      ${barRow((side==='offense'?'Offensive':'Defensive')+' success rate', overall.rate, overall.n)}
      <div style="font-size:12px; color:#6b6250; margin-top:4px;">Based on ${overall.n} play${overall.n===1?'':'s'}.</div>
    </div>
    ${groups}
    ${topCallsCard(plays)}
  `;
}
function successRate(plays){
  const n = plays.length;
  const s = plays.filter(p=>p.success).length;
  return {rate: n? s/n : 0, n};
}
function groupBy(plays, keyFn){
  const map = {};
  plays.forEach(p=>{
    const k = keyFn(p) || '—';
    if(!map[k]) map[k]=[];
    map[k].push(p);
  });
  return Object.entries(map).map(([k,arr])=>({key:k, ...successRate(arr)}))
    .sort((a,b)=>b.rate-a.rate);
}
function groupCard(title, rows){
  if(rows.length===0) return '';
  return `
    <div class="card">
      <h2>${title}</h2>
      ${rows.map(r=>barRow(r.key, r.rate, r.n)).join('')}
    </div>
  `;
}
function barRow(label, rate, n){
  const pct = Math.round(rate*100);
  const low = n < 3;
  return `
    <div class="bar-row">
      <div class="bar-label">
        <span class="name">${escapeHtml(label)}${low?`<span class="n-warn">n=${n}</span>`:''}</span>
        <span class="stat">${pct}% (${n})</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${low?'low':''}" style="width:${pct}%"></div></div>
    </div>
  `;
}
function topCallsCard(plays){
  const map = {};
  plays.forEach(p=>{
    if(!map[p.callString]) map[p.callString]=[];
    map[p.callString].push(p);
  });
  const rows = Object.entries(map)
    .map(([k,arr])=>({key:k, ...successRate(arr)}))
    .filter(r=>r.n>=2)
    .sort((a,b)=>b.rate-a.rate)
    .slice(0,8);
  if(rows.length===0) return `<div class="card"><h2>Top Calls</h2><div style="font-size:13px; color:#6b6250;">Need at least 2 reps of the same exact call to rank it. Keep logging!</div></div>`;
  return `<div class="card"><h2>Top Calls (min. 2 reps)</h2>${rows.map(r=>barRow(r.key, r.rate, r.n)).join('')}</div>`;
}

/* ===================== GAMES TAB ===================== */
function renderGames(){
  mainEl.innerHTML = `
    <div class="card">
      <h2>Roster Mode</h2>
      <div class="chipgrid">
        <button class="btn small ${state.mode==='8'?'selected':''}" onclick="setMode('8')">8-Man</button>
        <button class="btn small ${state.mode==='11'?'selected':''}" onclick="setMode('11')">11-Man</button>
      </div>
      <div style="font-size:12px; color:#6b6250; margin-top:8px;">Changes which personnel/formations, blitz calls, and receiver slots (adds Z) show up on the Log Play tab.</div>
    </div>

    <div class="card">
      <h2>New Game</h2>
      <div class="field">
        <label class="field-label">Opponent</label>
        <input type="text" id="newOpp" placeholder="e.g. Northgate">
      </div>
      <div class="field">
        <label class="field-label">Date</label>
        <input type="text" id="newDate" placeholder="e.g. 2026-09-12">
      </div>
      <button class="btn gold wide" onclick="createGame()">Create &amp; Select Game</button>
    </div>

    <div class="card">
      <h2>All Games</h2>
      ${state.games.length===0 ? `<div style="font-size:13px; color:#6b6250;">No games yet.</div>` : `
        <div class="recent-list">
          ${state.games.slice().reverse().map(g=>`
            <div class="play-row">
              <div>
                <div class="call">vs ${escapeHtml(g.opponent)}</div>
                <div class="meta">${escapeHtml(g.date||'')} · ${state.plays.filter(p=>p.gameId===g.id).length} plays</div>
              </div>
              <div style="display:flex; gap:8px;">
                <button class="btn small ${state.activeGameId===g.id?'selected':''}" onclick="selectGame('${g.id}')">${state.activeGameId===g.id?'Active':'Select'}</button>
                <button class="btn small danger" onclick="deleteGame('${g.id}')">✕</button>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}
function setMode(m){
  state.mode = m;
  state.builder.personnelId = null; state.builder.front=null; state.builder.blitz='None';
  state.builder.formation = null;
  saveState(); render();
}
function createGame(){
  const opp = document.getElementById('newOpp').value.trim();
  const date = document.getElementById('newDate').value.trim();
  if(!opp){ showFlash('Enter an opponent name'); return; }
  const g = {id:uid(), opponent:opp, date};
  state.games.push(g);
  state.activeGameId = g.id;
  saveState(); render();
  showFlash('Game created');
}
function selectGame(id){ state.activeGameId=id; saveState(); render(); }
function deleteGame(id){
  if(!confirm('Delete this game and ALL its logged plays? This cannot be undone.')) return;
  state.games = state.games.filter(g=>g.id!==id);
  state.plays = state.plays.filter(p=>p.gameId!==id);
  if(state.activeGameId===id) state.activeGameId = state.games.length? state.games[state.games.length-1].id : null;
  saveState(); render();
}

/* ===================== DATA TAB ===================== */
function renderData(){
  mainEl.innerHTML = `
    <div class="card">
      <h2>App Updates</h2>
      <p style="font-size:13px; color:#6b6250;">The app checks for updates automatically whenever you open it with a connection. Use this if you know I've pushed a fix and want it right now.</p>
      <button class="btn wide" onclick="checkForUpdates()">Check for Updates</button>
    </div>
    <div class="card">
      <h2>Backup Reminder</h2>
      <div class="backup-note">Data lives only on this device's browser storage. Export a CSV after every game and save it to Files / iCloud / email — don't rely on the app alone for long-term storage.</div>
    </div>
    <div class="card">
      <h2>Export</h2>
      <p style="font-size:13px; color:#6b6250;">${state.plays.length} total play${state.plays.length===1?'':'s'} across ${state.games.length} game${state.games.length===1?'':'s'} (offense + defense combined).</p>
      <button class="btn gold wide" onclick="exportCSV()">Export All Plays (CSV)</button>
    </div>
    <div class="card danger-zone">
      <h2 style="color:var(--red);">Danger Zone</h2>
      <p style="font-size:13px;">Permanently erase all games and plays from this device.</p>
      <button class="btn danger wide" onclick="wipeAll()">Erase All Data</button>
    </div>
  `;
}
function csvEscape(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function exportCSV(){
  const cols = ['Side','Game','Date','Quarter','Clock','Down','Distance',
    'DEF_Personnel','DEF_Front','DEF_Blitz','DEF_Shake','DEF_Coverage',
    'OFF_Formation','OFF_PersonnelPkg','OFF_Motion','OFF_PlayType','OFF_PlayCall','OFF_Modifiers','OFF_Fake',
    'FullCall','Yards','Tags','Success','Notes','Timestamp'];
  const lines = [cols.join(',')];
  state.plays.forEach(p=>{
    const g = state.games.find(x=>x.id===p.gameId);
    const isOff = p.side==='offense';
    const offPlayCall = !isOff ? '' : (
      p.playType==='run'
        ? [p.runNumber, (p.runConcepts||[]).join(' ')].filter(Boolean).join(' ')
        : slotsForMode(p.mode||'8').map(s=>(p.routes&&p.routes[s])||'').join('')
    );
    const row = [
      p.side||'defense', g? g.opponent : '', g? g.date : '',
      p.quarter, p.clock, p.down, p.distance,
      isOff? '' : (p.personnelId==='__custom'?p.personnelCustom:(personnelById(p.personnelId)?.label||'')),
      isOff? '' : (p.front==='__custom'?p.frontCustom:p.front),
      isOff? '' : (p.blitz==='__custom'?p.blitzCustom:p.blitz),
      isOff? '' : (p.shake?'Y':'N'),
      isOff? '' : (p.coverage==='__custom'?p.coverageCustom:p.coverage),
      !isOff? '' : (p.formation==='__custom'?p.formationCustom:p.formation),
      !isOff? '' : (p.personnelPackage||''),
      !isOff? '' : (p.motion==='__custom'?p.motionCustom:p.motion),
      !isOff? '' : (p.playType||''),
      offPlayCall,
      !isOff? '' : (p.modifiers||[]).concat(p.modifiersCustom?[p.modifiersCustom]:[]).join(' '),
      !isOff? '' : (p.fake? ('Fake '+(p.fakeText||'')) : ''),
      p.callString, p.yards, (p.tags||[]).join('; '), p.success?'Y':'N', p.notes,
      new Date(p.ts).toISOString(),
    ];
    lines.push(row.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ccs-football-plays-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function wipeAll(){
  if(!confirm('This will permanently erase ALL games and plays on this device. Continue?')) return;
  if(!confirm('Really sure? This cannot be undone.')) return;
  state = defaultState();
  saveState(); render();
}
function checkForUpdates(){
  if(!('serviceWorker' in navigator)){ showFlash('Not supported on this browser'); return; }
  navigator.serviceWorker.getRegistration().then((reg)=>{
    if(!reg){ showFlash('No service worker registered yet'); return; }
    showFlash('Checking…');
    reg.update().then(()=>{
      // If an update was found and takes over, controllerchange fires and reloads automatically.
      // If nothing changed, let the coach know so they're not left guessing.
      setTimeout(()=>{
        if(!document.hidden) showFlash('Up to date (or update installing…)');
      }, 1500);
    }).catch(()=>showFlash('Could not check — are you online?'));
  });
}

/* ===================== UTIL ===================== */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function jsAttr(value){
  // HTML-entity-encode a JSON-stringified value so it's safe inside an HTML
  // attribute regardless of quote characters in the data (e.g. "Wendy's").
  return escapeHtml(JSON.stringify(value));
}

/* ===================== INIT ===================== */
if(window.self !== window.top){
  document.getElementById('iframeWarning').style.display='block';
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').then((reg)=>{
      reg.update().catch(()=>{});
    }).catch(e=>console.error('SW register failed', e));

    // When a new version takes over, reload once automatically so the update
    // actually shows up, instead of silently sitting there uninstalled.
    let alreadyRefreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(alreadyRefreshed) return;
      alreadyRefreshed = true;
      window.location.reload();
    });
  });
}
render();
</script>
