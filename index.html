<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CCS Defense Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCS Defense">
<meta name="theme-color" content="#101b30">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --navy:#101b30;
    --navy-2:#1b2b4a;
    --gold:#b9924f;
    --gold-light:#e4c78a;
    --red:#9c2b23;
    --paper:#f3f1ea;
    --paper-2:#e8e4d8;
    --ink:#1a1a1a;
    --line:#cfc9b8;
    --good:#2f6b3f;
    --bad:#9c2b23;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--sans); height:100%; overscroll-behavior-y:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  #iframeWarning{display:none; background:var(--red); color:#fff; font-weight:700; padding:10px 14px; font-size:13px; text-align:center; line-height:1.4;}
  #iframeWarning a{color:#fff; text-decoration:underline;}

  header{background:var(--navy); color:var(--paper); padding:14px 16px 10px; position:sticky; top:0; z-index:20; border-bottom:3px solid var(--gold);}
  .brand{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand-title{font-weight:800; letter-spacing:.06em; text-transform:uppercase; font-size:15px; color:var(--gold-light);}
  .brand-sub{font-size:11px; opacity:.65; letter-spacing:.08em; text-transform:uppercase; margin-top:1px;}
  .game-pill{background:var(--navy-2); border:1px solid rgba(228,199,138,.35); color:var(--paper); font-size:11px; padding:5px 10px; border-radius:999px; white-space:nowrap; max-width:46vw; overflow:hidden; text-overflow:ellipsis;}

  nav{display:flex; background:var(--navy); border-bottom:1px solid rgba(0,0,0,.25);}
  nav button{flex:1; background:none; border:none; color:rgba(243,241,234,.55); font-family:var(--sans); font-weight:700; font-size:12px; letter-spacing:.03em; text-transform:uppercase; padding:10px 4px 12px; border-bottom:3px solid transparent;}
  nav button.active{color:var(--gold-light); border-bottom-color:var(--gold);}

  main{padding:14px 14px 90px; max-width:720px; margin:0 auto;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card h2{margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#6b6250; font-weight:800;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}

  /* Scoreboard chip */
  .scoreboard{display:flex; gap:10px; align-items:stretch; margin-bottom:14px;}
  .db-chip{flex:1; background:var(--navy); border-radius:14px; padding:12px 14px; color:var(--paper); border-bottom:3px solid var(--gold);}
  .db-chip .label{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold-light); opacity:.85; font-weight:700;}
  .db-chip .value{font-family:var(--mono); font-weight:800; font-size:22px; margin-top:2px; letter-spacing:.02em;}
  .qtr-chip{width:78px; background:var(--navy-2); border-radius:14px; padding:12px 8px; color:var(--paper); text-align:center; border-bottom:3px solid var(--gold);}
  .qtr-chip .label{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold-light); opacity:.85; font-weight:700;}
  .qtr-chip .value{font-family:var(--mono); font-weight:800; font-size:20px;}

  button{cursor:pointer; font-family:var(--sans);}
  .btn{border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:10px 12px; font-size:14px; font-weight:600; min-height:44px;}
  .btn.small{padding:7px 10px; font-size:12px; min-height:36px;}
  .btn.selected{background:var(--navy); color:var(--gold-light); border-color:var(--navy);}
  .btn.gold{background:var(--gold); border-color:var(--gold); color:var(--navy); font-weight:800;}
  .btn.gold:disabled{opacity:.35;}
  .btn.ghost{background:transparent; border-color:transparent; color:#6b6250; text-decoration:underline; min-height:auto; padding:6px 4px;}
  .btn.danger{background:#fff; border-color:var(--red); color:var(--red);}
  .btn.wide{width:100%;}

  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:44px; height:44px; border-radius:10px; font-size:20px; font-weight:800;}
  .stepper .num{font-family:var(--mono); font-size:20px; font-weight:800; min-width:54px; text-align:center;}

  .chipgrid{display:flex; flex-wrap:wrap; gap:8px;}
  .chipgrid button{flex:0 0 auto;}
  .step-summary{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; color:#6b6250; margin-bottom:8px;}
  .step-summary .tag{background:var(--paper-2); border-radius:8px; padding:4px 8px; font-weight:700; color:var(--navy); font-family:var(--mono); font-size:12px;}
  .step-summary .tag.empty{opacity:.4; font-weight:400; font-family:var(--sans);}

  .call-preview{background:var(--navy); color:var(--gold-light); font-family:var(--mono); font-weight:700; font-size:15px; padding:12px 14px; border-radius:12px; margin-bottom:12px; min-height:20px; word-break:break-word;}
  .call-preview .default-note{color:rgba(228,199,138,.55); font-family:var(--sans); font-weight:400; font-size:11px; display:block; margin-top:3px;}

  .custom-toggle{font-size:12px; color:#6b6250; text-decoration:underline; background:none; border:none; padding:4px 0;}
  input[type="text"], input[type="number"]{border:1.5px solid var(--line); border-radius:10px; padding:10px; font-size:14px; font-family:var(--sans); width:100%;}

  .result-tags{display:flex; flex-wrap:wrap; gap:8px;}
  .result-tags button{border-radius:999px;}

  .recent-list{display:flex; flex-direction:column; gap:8px;}
  .play-row{border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .play-row .meta{font-family:var(--mono); color:#6b6250; font-size:11px;}
  .play-row .call{font-weight:700; color:var(--navy);}
  .play-row .yards{font-family:var(--mono); font-weight:800; padding:3px 8px; border-radius:8px;}
  .yards.good{background:#e4f0e6; color:var(--good);}
  .yards.bad{background:#f5e2e0; color:var(--bad);}

  table{width:100%; border-collapse:collapse; font-size:12px;}
  th,td{text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); white-space:nowrap;}
  th{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:#6b6250;}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
  .bar-row .bar-label .name{font-weight:700; color:var(--navy);}
  .bar-row .bar-label .stat{font-family:var(--mono); color:#6b6250;}
  .bar-track{background:var(--paper-2); border-radius:6px; height:10px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--gold); border-radius:6px;}
  .bar-fill.low{background:var(--red);}
  .n-warn{font-size:10px; color:#b08a3e; margin-left:4px;}

  select{border:1.5px solid var(--line); border-radius:10px; padding:9px; font-size:14px; width:100%; background:#fff;}
  label.field-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#6b6250; font-weight:700; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .empty-state{text-align:center; padding:30px 10px; color:#8a8271;}
  .empty-state .big{font-size:15px; font-weight:700; color:var(--navy); margin-bottom:6px;}
  .save-bar{position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); z-index:15;}
  .flash{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--navy); color:var(--gold-light); padding:10px 18px; border-radius:999px; font-weight:700; font-size:13px; z-index:50; opacity:0; transition:opacity .2s;}
  .flash.show{opacity:1;}
  .backup-note{background:#fbf3e3; border:1px solid #e4c78a; border-radius:10px; padding:10px 12px; font-size:12.5px; color:#5a4a24; line-height:1.45;}
  .danger-zone{border:1px dashed var(--red); border-radius:10px; padding:10px 12px;}
  hr.sep{border:none; border-top:1px solid var(--line); margin:12px 0;}
</style>
</head>
<body>

<div id="iframeWarning">
  This is a live preview inside chat — your data won't be saved here.
  Download this file and open it directly in Safari on your iPad (then "Add to Home Screen") so play data actually persists between games.
</div>

<header>
  <div class="brand">
    <div>
      <div class="brand-title">CCS Defense Tracker</div>
      <div class="brand-sub">Pursue. Swarm. Hit.</div>
    </div>
    <div class="game-pill" id="activeGamePill">No game selected</div>
  </div>
</header>

<nav>
  <button data-tab="log" class="active">Log Play</button>
  <button data-tab="list">Play Log</button>
  <button data-tab="trends">Trends</button>
  <button data-tab="games">Games</button>
  <button data-tab="data">Data</button>
</nav>

<main id="main"></main>

<div class="flash" id="flash"></div>

<script>
/* ===================== DATA / TAXONOMY ===================== */

const PERSONNEL = [
  {id:'base8',  mode:'8',  label:'D-Base 41 Joker', formation:'4-2-2', roster:'E-H-LT-RT-M-J-LC-RC', family:'base',  isDefault:true},
  {id:'rhino8', mode:'8',  label:'Rhino',            formation:'5-1-2', roster:'E-H-LT-RT-NT-M-LC-RC', family:'rhino'},
  {id:'knight8',mode:'8',  label:'Knight',           formation:'4-3-1', roster:'E-H-LT-RT-M-J(L)-R-S', family:'other'},
  {id:'nickel8',mode:'8',  label:'Nickel',           formation:'3-2-3', roster:'E-H-NT-M-J-LC-RC-S', family:'nickel'},
  {id:'skinny8',mode:'8',  label:'Skinny',           formation:'2-2-4', roster:'E-H-M-J-LC-RC-SS-S', family:'other'},

  {id:'base11',  mode:'11', label:'Base 43 Joker',  formation:'4-4-3', roster:'E-H-LT-RT-M-L-R-J-LC-RC-S', family:'base', isDefault:true},
  {id:'rhino11', mode:'11', label:'Rhino 52 Joker', formation:'5-3-3', roster:'E-H-LT-RT-NT-M-L-J-LC-RC-S', family:'rhino'},
  {id:'nickel11',mode:'11', label:'Nickel',          formation:'3-3-5', roster:'E-H-NT-M-L-R-J-LC-RC-N-S', family:'nickel'},
  {id:'skinny11',mode:'11', label:'Skinny',          formation:'3-2-6', roster:'E-H-NT-M-L-J-LC-RC-N-D-S', family:'other'},
];

const FRONTS = {
  base:  ['Even','Over','Under','Alpha','Beta','Even Pinch','Even Slant','Even Out','Even Tango','Even Hammer','Even Double Pinch'],
  rhino: ['Rhino Even','Rhino Odd (Beta)','Rhino Wide','Rhino Under','Rhino Over','Rhino Even Pinch','Rhino Even Slant Right','Rhino Even Out','Rhino Even Stunt','Rhino Wide Pinch','Rhino Wide Slant','Rhino Odd Slant'],
  nickel:['Hammer','Over','Slant','Sting','Tango'],
  other: ['Even','Over','Under','Storm'],
};

const BLITZ = {
  '8':  ['None','Ace','Aces','Strike','Laser','Rocket'],
  '11': ['None','Owl','Owls','House','Joker','Strike','Laser','Rocket'],
};

const COVERAGE_GROUPS = [
  {label:'Man', items:['Cover 0 (Michigan)','Cover 0 (Miami)','Cover 1 (Halo Michigan)','Michigan Halo Robber','Michigan Double Halo']},
  {label:'Zone', items:['Cover 2 (Alabama)','Cover 2 (Arkansas)','Trips Zone (Trips Alabama)','Cover 3 (Cloud)','Cover 3/4 (Storm Cloud)','Cover 3 Robber (Ace)','Cover 3 Robber (Tango)','Cover 4 (Storm Cloud Ace)'],
  },
];

const RESULT_TAGS = ['Sack','TFL','INT','Fumble Recovery','Forced Fumble','Pass Breakup','Penalty (Us)','Penalty (Them)','TD Allowed','QB Scramble'];

const DISTANCE_PRESETS = [1,2,3,5,7,10,15,20];

/* ===================== STATE ===================== */

const STORAGE_KEY = 'ccsDefenseState_v1';

function defaultState(){
  return {
    mode:'8', // '8' or '11'
    games: [],
    activeGameId: null,
    plays: [],
    builder: emptyBuilder(),
  };
}
function emptyBuilder(){
  return {
    down:1, distance:10, quarter:1, clock:'',
    personnelId:null, personnelCustom:'',
    front:null, frontCustom:'',
    blitz:'None', blitzCustom:'', shake:false,
    coverage:null, coverageCustom:'',
    yards:0, tags:[], notes:'',
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return Object.assign(base, parsed, {builder: Object.assign(emptyBuilder(), parsed.builder||{})});
  }catch(e){
    console.error('Failed to load state, starting fresh.', e);
    return defaultState();
  }
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Storage error', e);
    showFlash('⚠️ Could not save — storage may be full');
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ===================== SUCCESS MODEL ===================== */
// Standard down-and-distance success convention, inverted for defense:
// Offense is considered "successful" if it gains >=50% of needed yards on 1st,
// >=70% on 2nd, or converts (>=100%) on 3rd/4th. Defensive success = the inverse,
// with turnovers always counted as a defensive success and a TD allowed always a failure.
function computeSuccess(down, distance, yards, tags){
  if(tags.includes('INT') || tags.includes('Fumble Recovery')) return true;
  if(tags.includes('TD Allowed')) return false;
  const dist = Math.max(distance,1);
  let offenseSuccess;
  if(down===1) offenseSuccess = yards >= 0.5*dist;
  else if(down===2) offenseSuccess = yards >= 0.7*dist;
  else offenseSuccess = yards >= dist;
  return !offenseSuccess;
}

/* ===================== CALL STRING ===================== */
function personnelById(id){ return PERSONNEL.find(p=>p.id===id); }
function frontFamilyFor(personnelId){
  const p = personnelById(personnelId);
  return p ? p.family : 'other';
}
function buildCallString(b){
  const p = personnelById(b.personnelId);
  const personnelLabel = b.personnelId==='__custom' ? b.personnelCustom : (p? p.label : '');
  const isDefaultPersonnel = p && p.isDefault;
  const frontLabel = b.front==='__custom' ? b.frontCustom : b.front;
  const blitzLabel = b.blitz==='__custom' ? b.blitzCustom : b.blitz;
  const blitzPart = (blitzLabel && blitzLabel!=='None') ? (blitzLabel + (b.shake? ' (Shake)':'')) : null;
  const covLabel = b.coverage==='__custom' ? b.coverageCustom : b.coverage;

  let str = frontLabel ? (personnelLabel && !isDefaultPersonnel ? personnelLabel+' ' : '') + frontLabel : '';
  const rest = [blitzPart, covLabel].filter(Boolean);
  if(rest.length) str += (str? ', ':'') + rest.join(', ');
  return str || '(building call…)';
}

/* ===================== NAV / RENDER ===================== */
const mainEl = document.getElementById('main');
const navButtons = document.querySelectorAll('nav button');
let activeTab = 'log';

navButtons.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    navButtons.forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });
});

function showFlash(msg){
  const f = document.getElementById('flash');
  f.textContent = msg;
  f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'), 1400);
}

function activeGame(){
  return state.games.find(g=>g.id===state.activeGameId) || null;
}
function updateGamePill(){
  const pill = document.getElementById('activeGamePill');
  const g = activeGame();
  pill.textContent = g ? ('vs '+g.opponent+(g.date? ' · '+g.date:'')) : 'No game selected';
}

function render(){
  updateGamePill();
  if(activeTab==='log') renderLog();
  else if(activeTab==='list') renderList();
  else if(activeTab==='trends') renderTrends();
  else if(activeTab==='games') renderGames();
  else if(activeTab==='data') renderData();
}

/* ===================== LOG PLAY TAB ===================== */
function renderLog(){
  const b = state.builder;
  const g = activeGame();

  if(!g){
    mainEl.innerHTML = `
      <div class="card empty-state">
        <div class="big">Start a game first</div>
        <p>Create or select a game under the "Games" tab, then come back here to log plays.</p>
        <button class="btn gold" onclick="switchTab('games')">Go to Games</button>
      </div>`;
    return;
  }

  const pFamily = frontFamilyFor(b.personnelId);
  const frontOptions = FRONTS[pFamily] || FRONTS.other;
  const blitzOptions = BLITZ[state.mode];

  mainEl.innerHTML = `
    <div class="card">
      <h2>Situation</h2>
      <div class="row" style="margin-bottom:10px;">
        <div style="flex:1;">
          <label class="field-label">Down</label>
          <div class="chipgrid">
            ${[1,2,3,4].map(d=>`<button class="btn small ${b.down===d?'selected':''}" onclick="setDown(${d})">${ordinal(d)}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="row" style="margin-bottom:10px;">
        <div style="flex:1;">
          <label class="field-label">Distance</label>
          <div class="chipgrid">
            ${DISTANCE_PRESETS.map(dist=>`<button class="btn small ${b.distance===dist?'selected':''}" onclick="setDistance(${dist})">${dist}</button>`).join('')}
            <div class="stepper" style="margin-left:4px;">
              <button class="btn small" onclick="nudgeDistance(-1)">&minus;</button>
              <span class="num" style="font-size:14px; min-width:34px;">${b.distance}</span>
              <button class="btn small" onclick="nudgeDistance(1)">+</button>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div style="flex:1;">
          <label class="field-label">Quarter</label>
          <div class="chipgrid">
            ${[1,2,3,4,'OT'].map(q=>`<button class="btn small ${String(b.quarter)===String(q)?'selected':''}" onclick="setQuarter('${q}')">${q===  'OT'?'OT':'Q'+q}</button>`).join('')}
          </div>
        </div>
        <div style="width:110px;">
          <label class="field-label">Clock (opt.)</label>
          <input type="text" placeholder="e.g. 6:42" value="${escapeHtml(b.clock)}" oninput="setClock(this.value)">
        </div>
      </div>
    </div>

    <div class="call-preview">
      ${escapeHtml(buildCallString(b))}
      <span class="default-note">Personnel omitted above = default (${PERSONNEL.find(p=>p.mode===state.mode&&p.isDefault).label})</span>
    </div>

    <div class="card">
      <h2>1 · Personnel</h2>
      <div class="chipgrid">
        ${PERSONNEL.filter(p=>p.mode===state.mode).map(p=>`
          <button class="btn small ${b.personnelId===p.id?'selected':''}" onclick="setPersonnel('${p.id}')">${p.label}<br><span style="font-weight:400; font-size:10px; opacity:.7;">${p.formation}</span></button>
        `).join('')}
        <button class="btn small ${b.personnelId==='__custom'?'selected':''}" onclick="setPersonnel('__custom')">Other…</button>
      </div>
      ${b.personnelId==='__custom' ? `<input style="margin-top:8px;" type="text" placeholder="Custom personnel call" value="${escapeHtml(b.personnelCustom)}" oninput="state.builder.personnelCustom=this.value; saveState(); renderPreviewOnly();">` : ''}
    </div>

    <div class="card">
      <h2>2 · Front / DL Call</h2>
      <div class="chipgrid">
        ${frontOptions.map(f=>`<button class="btn small ${b.front===f?'selected':''}" onclick='setFront(${JSON.stringify(f)})'>${f}</button>`).join('')}
        <button class="btn small ${b.front==='__custom'?'selected':''}" onclick="setFront('__custom')">Other…</button>
      </div>
      ${b.front==='__custom' ? `<input style="margin-top:8px;" type="text" placeholder="Custom front/call" value="${escapeHtml(b.frontCustom)}" oninput="state.builder.frontCustom=this.value; saveState(); renderPreviewOnly();">` : ''}
    </div>

    <div class="card">
      <h2>3 · Blitz</h2>
      <div class="chipgrid">
        ${blitzOptions.map(bl=>`<button class="btn small ${b.blitz===bl?'selected':''}" onclick='setBlitz(${JSON.stringify(bl)})'>${bl}</button>`).join('')}
        <button class="btn small ${b.blitz==='__custom'?'selected':''}" onclick="setBlitz('__custom')">Other…</button>
      </div>
      ${b.blitz==='__custom' ? `<input style="margin-top:8px;" type="text" placeholder="Custom blitz" value="${escapeHtml(b.blitzCustom)}" oninput="state.builder.blitzCustom=this.value; saveState(); renderPreviewOnly();">` : ''}
      ${b.blitz!=='None' ? `<label style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13px;"><input type="checkbox" ${b.shake?'checked':''} onchange="setShake(this.checked)"> "Shake" (show blitz, drop)</label>` : ''}
    </div>

    <div class="card">
      <h2>4 · Coverage</h2>
      ${COVERAGE_GROUPS.map(grp=>`
        <div style="margin-bottom:8px;">
          <div style="font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#8a8271; margin-bottom:5px;">${grp.label}</div>
          <div class="chipgrid">
            ${grp.items.map(c=>`<button class="btn small ${b.coverage===c?'selected':''}" onclick='setCoverage(${JSON.stringify(c)})'>${c}</button>`).join('')}
          </div>
        </div>
      `).join('')}
      <button class="btn small ${b.coverage==='__custom'?'selected':''}" onclick="setCoverage('__custom')">Other…</button>
      ${b.coverage==='__custom' ? `<input style="margin-top:8px;" type="text" placeholder="Custom coverage" value="${escapeHtml(b.coverageCustom)}" oninput="state.builder.coverageCustom=this.value; saveState(); renderPreviewOnly();">` : ''}
    </div>

    <div class="card">
      <h2>Result</h2>
      <label class="field-label">Yards gained by offense</label>
      <div class="row" style="margin-bottom:10px;">
        <div class="chipgrid">
          ${[-5,-3,-1,0,2,4,6,10,15,20].map(y=>`<button class="btn small ${b.yards===y?'selected':''}" onclick="setYards(${y})">${y>0?'+':''}${y}</button>`).join('')}
        </div>
      </div>
      <div class="stepper" style="margin-bottom:12px;">
        <button onclick="nudgeYards(-1)">&minus;</button>
        <span class="num">${b.yards>0?'+':''}${b.yards}</span>
        <button onclick="nudgeYards(1)">+</button>
      </div>
      <label class="field-label">Tags</label>
      <div class="result-tags">
        ${RESULT_TAGS.map(t=>`<button class="btn small ${b.tags.includes(t)?'selected':''}" onclick="toggleTag('${t}')">${t}</button>`).join('')}
      </div>
      <div class="field" style="margin-top:12px;">
        <label class="field-label">Notes (optional)</label>
        <input type="text" placeholder="e.g. slot receiver beat coverage" value="${escapeHtml(b.notes)}" oninput="state.builder.notes=this.value; saveState();">
      </div>
    </div>

    <div class="save-bar">
      <div class="row" style="align-items:center;">
        <button class="btn ghost" onclick="repeatLastCall()">Repeat last call</button>
        <div style="flex:1;"></div>
        <button class="btn danger small" onclick="resetBuilder()">Clear</button>
        <button class="btn gold wide" style="flex:2;" ${!canSave(b)?'disabled':''} onclick="savePlay()">Save Play</button>
      </div>
    </div>
  `;
}

function renderPreviewOnly(){
  const preview = document.querySelector('.call-preview');
  if(preview) preview.innerHTML = escapeHtml(buildCallString(state.builder)) +
    `<span class="default-note">Personnel omitted above = default (${PERSONNEL.find(p=>p.mode===state.mode&&p.isDefault).label})</span>`;
}

function canSave(b){
  const hasPersonnel = b.personnelId==='__custom' ? !!b.personnelCustom.trim() : !!b.personnelId;
  const hasFront = b.front==='__custom' ? !!b.frontCustom.trim() : !!b.front;
  const hasCoverage = b.coverage==='__custom' ? !!b.coverageCustom.trim() : !!b.coverage;
  return hasPersonnel && hasFront && hasCoverage;
}

function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':'4th'; }

function switchTab(t){
  activeTab = t;
  navButtons.forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}

/* ---- builder setters ---- */
function setDown(d){ state.builder.down=d; saveState(); render(); }
function setDistance(d){ state.builder.distance=d; saveState(); render(); }
function nudgeDistance(delta){ state.builder.distance = Math.max(1, state.builder.distance+delta); saveState(); render(); }
function setQuarter(q){ state.builder.quarter=q; saveState(); render(); }
function setClock(v){ state.builder.clock=v; saveState(); }
function setPersonnel(id){
  state.builder.personnelId=id;
  // reset front if it no longer matches the new personnel family
  state.builder.front=null; state.builder.frontCustom='';
  saveState(); render();
}
function setFront(f){ state.builder.front=f; saveState(); render(); }
function setBlitz(bl){ state.builder.blitz=bl; saveState(); render(); }
function setShake(v){ state.builder.shake=v; saveState(); render(); }
function setCoverage(c){ state.builder.coverage=c; saveState(); render(); }
function setYards(y){ state.builder.yards=y; saveState(); render(); }
function nudgeYards(delta){ state.builder.yards += delta; saveState(); render(); }
function toggleTag(t){
  const i = state.builder.tags.indexOf(t);
  if(i>=0) state.builder.tags.splice(i,1); else state.builder.tags.push(t);
  saveState(); render();
}
function resetBuilder(){
  const keep = {down:state.builder.down, distance:10, quarter:state.builder.quarter, clock:state.builder.clock};
  state.builder = Object.assign(emptyBuilder(), keep);
  saveState(); render();
}
function repeatLastCall(){
  const last = state.plays.filter(p=>p.gameId===state.activeGameId).slice(-1)[0];
  if(!last){ showFlash('No previous play to repeat'); return; }
  state.builder = Object.assign(emptyBuilder(), {
    down:state.builder.down, distance:state.builder.distance, quarter:state.builder.quarter, clock:state.builder.clock,
    personnelId:last.personnelId, personnelCustom:last.personnelCustom||'',
    front:last.front, frontCustom:last.frontCustom||'',
    blitz:last.blitz, blitzCustom:last.blitzCustom||'', shake:last.shake,
    coverage:last.coverage, coverageCustom:last.coverageCustom||'',
  });
  saveState(); render();
  showFlash('Loaded last call — set result after the snap');
}

function savePlay(){
  const b = state.builder;
  if(!canSave(b)) return;
  const callString = buildCallString(b);
  const success = computeSuccess(b.down, b.distance, b.yards, b.tags);
  const play = {
    id: uid(),
    gameId: state.activeGameId,
    ts: Date.now(),
    quarter: b.quarter, clock: b.clock,
    down: b.down, distance: b.distance,
    personnelId: b.personnelId, personnelCustom: b.personnelCustom,
    front: b.front, frontCustom: b.frontCustom,
    blitz: b.blitz, blitzCustom: b.blitzCustom, shake: b.shake,
    coverage: b.coverage, coverageCustom: b.coverageCustom,
    callString,
    yards: b.yards, tags: b.tags.slice(), notes: b.notes,
    success,
    mode: state.mode,
  };
  state.plays.push(play);
  resetBuilder();
  saveState();
  showFlash('Play saved ✓');
  render();
}

/* ===================== PLAY LOG TAB ===================== */
function renderList(){
  const g = activeGame();
  const plays = state.plays.filter(p=>!g || p.gameId===state.activeGameId).slice().reverse();
  if(plays.length===0){
    mainEl.innerHTML = `<div class="card empty-state"><div class="big">No plays logged yet</div><p>Plays you save on the Log Play tab will show up here.</p></div>`;
    return;
  }
  mainEl.innerHTML = `
    <div class="card">
      <h2>${g? 'vs '+g.opponent : 'All Games'} — ${plays.length} play${plays.length===1?'':'s'}</h2>
      <div class="recent-list">
        ${plays.map(p=>`
          <div class="play-row">
            <div>
              <div class="call">${escapeHtml(p.callString)}</div>
              <div class="meta">${ordinal(p.down)} &amp; ${p.distance} · Q${p.quarter}${p.clock? ' · '+escapeHtml(p.clock):''}${p.tags.length? ' · '+p.tags.join(', '):''}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="yards ${p.success?'good':'bad'}">${p.yards>0?'+':''}${p.yards}</div>
              <button class="btn small danger" onclick="deletePlay('${p.id}')">✕</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function deletePlay(id){
  if(!confirm('Delete this play?')) return;
  state.plays = state.plays.filter(p=>p.id!==id);
  saveState(); render();
}

/* ===================== TRENDS TAB ===================== */
function renderTrends(){
  const g = activeGame();
  mainEl.innerHTML = `
    <div class="card">
      <h2>Scope</h2>
      <div class="chipgrid">
        <button class="btn small ${window.__trendScope!=='all'?'selected':''}" onclick="setTrendScope('game')">This Game</button>
        <button class="btn small ${window.__trendScope==='all'?'selected':''}" onclick="setTrendScope('all')">All Games</button>
      </div>
    </div>
    <div id="trendsBody"></div>
  `;
  const scope = window.__trendScope || 'game';
  const plays = scope==='all' ? state.plays : state.plays.filter(p=>p.gameId===state.activeGameId);
  const body = document.getElementById('trendsBody');
  if(plays.length===0){
    body.innerHTML = `<div class="card empty-state"><div class="big">Not enough data yet</div><p>Log a few plays to see trends here.</p></div>`;
    return;
  }
  const overall = successRate(plays);
  body.innerHTML = `
    <div class="card">
      <h2>Overall</h2>
      ${barRow('Defensive success rate', overall.rate, overall.n)}
      <div style="font-size:12px; color:#6b6250; margin-top:4px;">Success = stop offense below down-and-distance threshold, or force a turnover. Based on ${overall.n} play${overall.n===1?'':'s'}.</div>
    </div>
    ${groupCard('By Down', groupBy(plays, p=>ordinal(p.down)))}
    ${groupCard('By Personnel', groupBy(plays, p=>p.personnelId==='__custom'?p.personnelCustom:(personnelById(p.personnelId)?.label||'—')))}
    ${groupCard('By Front / Call', groupBy(plays, p=>p.front==='__custom'?p.frontCustom:p.front))}
    ${groupCard('By Blitz', groupBy(plays, p=>(p.blitz==='__custom'?p.blitzCustom:p.blitz)||'None'))}
    ${groupCard('By Coverage', groupBy(plays, p=>p.coverage==='__custom'?p.coverageCustom:p.coverage))}
    ${topCallsCard(plays)}
  `;
}
function setTrendScope(s){ window.__trendScope = s; render(); }
function successRate(plays){
  const n = plays.length;
  const s = plays.filter(p=>p.success).length;
  return {rate: n? s/n : 0, n};
}
function groupBy(plays, keyFn){
  const map = {};
  plays.forEach(p=>{
    const k = keyFn(p) || '—';
    if(!map[k]) map[k]=[];
    map[k].push(p);
  });
  return Object.entries(map).map(([k,arr])=>({key:k, ...successRate(arr)}))
    .sort((a,b)=>b.rate-a.rate);
}
function groupCard(title, rows){
  if(rows.length===0) return '';
  return `
    <div class="card">
      <h2>${title}</h2>
      ${rows.map(r=>barRow(r.key, r.rate, r.n)).join('')}
    </div>
  `;
}
function barRow(label, rate, n){
  const pct = Math.round(rate*100);
  const low = n < 3;
  return `
    <div class="bar-row">
      <div class="bar-label">
        <span class="name">${escapeHtml(label)}${low?`<span class="n-warn">n=${n}</span>`:''}</span>
        <span class="stat">${pct}% (${n})</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${low?'low':''}" style="width:${pct}%"></div></div>
    </div>
  `;
}
function topCallsCard(plays){
  const map = {};
  plays.forEach(p=>{
    if(!map[p.callString]) map[p.callString]=[];
    map[p.callString].push(p);
  });
  const rows = Object.entries(map)
    .map(([k,arr])=>({key:k, ...successRate(arr)}))
    .filter(r=>r.n>=2)
    .sort((a,b)=>b.rate-a.rate)
    .slice(0,8);
  if(rows.length===0) return `<div class="card"><h2>Top Calls</h2><div style="font-size:13px; color:#6b6250;">Need at least 2 reps of the same exact call to rank it. Keep logging!</div></div>`;
  return `<div class="card"><h2>Top Calls (min. 2 reps)</h2>${rows.map(r=>barRow(r.key, r.rate, r.n)).join('')}</div>`;
}

/* ===================== GAMES TAB ===================== */
function renderGames(){
  mainEl.innerHTML = `
    <div class="card">
      <h2>Roster Mode</h2>
      <div class="chipgrid">
        <button class="btn small ${state.mode==='8'?'selected':''}" onclick="setMode('8')">8-Man</button>
        <button class="btn small ${state.mode==='11'?'selected':''}" onclick="setMode('11')">11-Man</button>
      </div>
      <div style="font-size:12px; color:#6b6250; margin-top:8px;">Changes which personnel groups / blitz calls show up on the Log Play tab.</div>
    </div>

    <div class="card">
      <h2>New Game</h2>
      <div class="field">
        <label class="field-label">Opponent</label>
        <input type="text" id="newOpp" placeholder="e.g. Northgate">
      </div>
      <div class="field">
        <label class="field-label">Date</label>
        <input type="text" id="newDate" placeholder="e.g. 2026-09-12">
      </div>
      <button class="btn gold wide" onclick="createGame()">Create &amp; Select Game</button>
    </div>

    <div class="card">
      <h2>All Games</h2>
      ${state.games.length===0 ? `<div style="font-size:13px; color:#6b6250;">No games yet.</div>` : `
        <div class="recent-list">
          ${state.games.slice().reverse().map(g=>`
            <div class="play-row">
              <div>
                <div class="call">vs ${escapeHtml(g.opponent)}</div>
                <div class="meta">${escapeHtml(g.date||'')} · ${state.plays.filter(p=>p.gameId===g.id).length} plays</div>
              </div>
              <div style="display:flex; gap:8px;">
                <button class="btn small ${state.activeGameId===g.id?'selected':''}" onclick="selectGame('${g.id}')">${state.activeGameId===g.id?'Active':'Select'}</button>
                <button class="btn small danger" onclick="deleteGame('${g.id}')">✕</button>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}
function setMode(m){
  state.mode = m;
  state.builder.personnelId = null; state.builder.front=null; state.builder.blitz='None';
  saveState(); render();
}
function createGame(){
  const opp = document.getElementById('newOpp').value.trim();
  const date = document.getElementById('newDate').value.trim();
  if(!opp){ showFlash('Enter an opponent name'); return; }
  const g = {id:uid(), opponent:opp, date};
  state.games.push(g);
  state.activeGameId = g.id;
  saveState(); render();
  showFlash('Game created');
}
function selectGame(id){ state.activeGameId=id; saveState(); render(); }
function deleteGame(id){
  if(!confirm('Delete this game and ALL its logged plays? This cannot be undone.')) return;
  state.games = state.games.filter(g=>g.id!==id);
  state.plays = state.plays.filter(p=>p.gameId!==id);
  if(state.activeGameId===id) state.activeGameId = state.games.length? state.games[state.games.length-1].id : null;
  saveState(); render();
}

/* ===================== DATA TAB ===================== */
function renderData(){
  mainEl.innerHTML = `
    <div class="card">
      <h2>Backup Reminder</h2>
      <div class="backup-note">Data lives only on this iPad's browser storage. Export a CSV after every game and save it to Files / iCloud / email — don't rely on the app alone for long-term storage.</div>
    </div>
    <div class="card">
      <h2>Export</h2>
      <p style="font-size:13px; color:#6b6250;">${state.plays.length} total play${state.plays.length===1?'':'s'} across ${state.games.length} game${state.games.length===1?'':'s'}.</p>
      <button class="btn gold wide" onclick="exportCSV()">Export All Plays (CSV)</button>
    </div>
    <div class="card danger-zone">
      <h2 style="color:var(--red);">Danger Zone</h2>
      <p style="font-size:13px;">Permanently erase all games and plays from this device.</p>
      <button class="btn danger wide" onclick="wipeAll()">Erase All Data</button>
    </div>
  `;
}
function csvEscape(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function exportCSV(){
  const cols = ['Game','Date','Quarter','Clock','Down','Distance','Personnel','Front','Blitz','Shake','Coverage','FullCall','Yards','Tags','Success','Notes','Timestamp'];
  const lines = [cols.join(',')];
  state.plays.forEach(p=>{
    const g = state.games.find(x=>x.id===p.gameId);
    const row = [
      g? g.opponent : '', g? g.date : '',
      p.quarter, p.clock, p.down, p.distance,
      p.personnelId==='__custom'?p.personnelCustom:(personnelById(p.personnelId)?.label||''),
      p.front==='__custom'?p.frontCustom:p.front,
      p.blitz==='__custom'?p.blitzCustom:p.blitz,
      p.shake?'Y':'N',
      p.coverage==='__custom'?p.coverageCustom:p.coverage,
      p.callString, p.yards, p.tags.join('; '), p.success?'Y':'N', p.notes,
      new Date(p.ts).toISOString(),
    ];
    lines.push(row.map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ccs-defense-plays-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function wipeAll(){
  if(!confirm('This will permanently erase ALL games and plays on this device. Continue?')) return;
  if(!confirm('Really sure? This cannot be undone.')) return;
  state = defaultState();
  saveState(); render();
}

/* ===================== UTIL ===================== */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== INIT ===================== */
if(window.self !== window.top){
  document.getElementById('iframeWarning').style.display='block';
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(e=>console.error('SW register failed', e));
  });
}
render();
</script>
